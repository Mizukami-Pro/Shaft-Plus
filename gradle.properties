# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
android.enableJetifier=true
android.useAndroidX=true
# R8 full-mode + optimized resource shrinking needs materially more headroom than dex-only builds.
# 1.5 GiB caused GC thrashing on the release graph; cap both heaps so local/CI builds stay stable.
# 本机 32GB 内存 / 16C32T（用户要求按「水上书加速约定」压榨性能）：
# daemon 堆 8g + 元空间 2g；并行 + 构建缓存开启；kotlin daemon 单独 4g。
# configuration-cache 暂不开启：本项目 AGP + kapt + dataBinding/Room 注解处理器链路与之兼容性未验证，
# 开启会让所有构建直接失败，收益（配置阶段缓存）远小于风险，故保持默认关闭。
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx4g
# 禁用 configuration cache（见上方说明）
# org.gradle.configuration-cache=true
android.injected.testOnly=false
org.gradle.warning.mode=all
# AGP 8.7 opt-in: let R8 analyze code and resources as one reachability graph.
android.r8.optimizedResourceShrinking=true
